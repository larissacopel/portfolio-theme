<!DOCTYPE html>
<html lang="en">
{%- include head.html -%}

<body id="body">
    <div class="header">
        {%- include header.html -%}
    </div>
    <div class="wrapper">
        <main class="content">
            {% if page.url != '/' %}
            <h1 class="page-title">{{ page.title }}</h1>
            <h2 class="page-subtitle">{{ page.subtitle }}</h2>
            {% endif %}

            {{ content }}
        </main>
    </div>
</body>

</html>
