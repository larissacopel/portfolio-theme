<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Apply theme before loading CSS -->
  <script>
    (function () {
      const savedMode = localStorage.getItem("LightDarkMode") || "dark";
      document.documentElement.classList.add(savedMode);
    })();
  </script>

  <link rel="stylesheet" href="/assets/main.css">

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>

  <script>
    function switchLightDarkMode() {
      const html = document.documentElement;
      const newMode = html.classList.contains('light') ? 'dark' : 'light';

      html.classList.remove('light', 'dark');
      html.classList.add(newMode);

      localStorage.setItem("LightDarkMode", newMode);
    }

    function changeActive() {
      const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
      const links = document.querySelectorAll('.sidebar-item');

      links.forEach(link => {
        const linkPath = new URL(link.href).pathname.replace(/\/+$/, '') || '/';

        link.classList.remove('sidebar-item-active');

        if (
          currentPath === linkPath ||
          (linkPath !== '/' && currentPath.startsWith(linkPath + '/'))
        ) {
          link.classList.add('sidebar-item-active');
        }
      });
    }

    window.onload = function () {
      changeActive();
    };
  </script>
</head>
